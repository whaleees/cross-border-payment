[package]
name = "ibc"
version = "0.1.0"
edition = "2024"

[dependencies]
curve25519-dalek = { version = "4", features = ["digest", "rand_core"] }
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
merlin = "3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "protocols"
harness = false

[[bench]]
name = "scaling"
harness = false
