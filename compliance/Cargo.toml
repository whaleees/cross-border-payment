[package]
name = "compliance"
version = "0.1.0"
edition = "2024"

[dependencies]
ibc = { path = ".." }
curve25519-dalek = { version = "4", features = ["digest", "rand_core"] }
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
bulletproofs = "5.0.0"
merlin = "3"

[features]
# The prover's secret multi-scalar multiplications run in variable time. Faster,
# but leaks timing; only for measuring what constant time costs.
vartime-prover = []

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "components"
harness = false

[[bench]]
name = "scaling"
harness = false

# Tests run in debug; the curve arithmetic underneath (including Kresna's crate)
# runs optimised, or every range proof takes seconds.
[profile.dev.package."*"]
opt-level = 3
